name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 跑评测并守门（hit@3 / 拒答 / 综合 不得低于基线）
        run: python check_metrics.py

      - name: 留档本次结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/latest.json
